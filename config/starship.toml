# Omarchy Starship Prompt Configuration (Tokyo Night Theme)

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$ruby\
$docker_context\
$package\
$cmd_duration\
$line_break\
$character"""

# Timeout for commands executed by Starship
command_timeout = 500

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"

[directory]
style = "bold #7dcfff"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #e0af68"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "$ "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[cmd_duration]
min_time = 2_000
style = "bold #e0af68"
format = "took [$duration]($style) "

[nodejs]
symbol = " "
style = "bold #9ece6a"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold #ff9e64"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #7dcfff"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #e0af68"
format = "via [${symbol}${pyenv_prefix}(${version} )]($style)"

[ruby]
symbol = " "
style = "bold #f7768e"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold #2ac3de"
format = "via [$symbol$context]($style) "

[package]
symbol = "󰏗 "
style = "bold #7aa2f7"
format = "is [$symbol$version]($style) "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰁾 "

# Hyprland Configuration for Dell Latitude 7210 2-in-1 (Omarchy Style)

monitor = eDP-1, 1920x1280@60.005, 0x0, 1.33
monitor = , preferred, auto, auto

$terminal    = kitty
$fileManager = nautilus
$menu        = wofi --show drun
$mainMod     = SUPER

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = waybar & swaync & hyprpaper & hypridle &

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(495068aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.17
    }
    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = 0xee1a1a1a
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Keybindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, killactive
bind = $mainMod, W, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, M, exit

# Lock screen, Omarchy Control Hub, Theme switcher & Lazygit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod ALT, Space, exec, ~/.local/bin/omarchy-menu
bind = $mainMod ALT, T, exec, ~/.local/bin/omarchy-theme
bind = $mainMod, G, exec, kitty --class lazygit-float -e lazygit
bind = $mainMod ALT, M, exec, kitty --class ytfzf-music -e ytm

# Workspaces 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse window moving/resizing
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware Media Keys (Dell 7210)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media Playback Controls
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindl  = , XF86AudioStop, exec, playerctl stop

bind   = $mainMod, backslash, exec, playerctl play-pause
bind   = $mainMod, bracketright, exec, playerctl next
bind   = $mainMod, bracketleft, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Tablet Rotation, Refresh Rate & Eco Mode Toggles
bind = $mainMod SHIFT, R, exec, ~/.local/bin/rotate-screen
bind = $mainMod SHIFT, D, exec, ~/.local/bin/toggle-refresh-rate
bind = $mainMod SHIFT, E, exec, ~/.local/bin/toggle-eco-mode

# Omarchy AI Agent Emulation (herdr + agy)
bind = $mainMod, Space, togglespecialworkspace, agent
bind = $mainMod, S, togglespecialworkspace, agent
bind = $mainMod SHIFT, C, exec, ~/.local/bin/ai-debug-crash

# Keybindings Cheatsheet (Super + ? / Super + /)
bind = $mainMod, slash, exec, ~/.local/bin/hypr-cheatsheet
bind = $mainMod SHIFT, slash, exec, ~/.local/bin/hypr-cheatsheet

# Special workspace configuration
workspace = special:agent, on-created-empty:~/.local/bin/agent-scratchpad

# Window rules
windowrulev2 = float, class:^(agent-terminal)$
windowrulev2 = size 95% 90%, class:^(agent-terminal)$
windowrulev2 = center, class:^(agent-terminal)$

windowrulev2 = bordersize 0, fullscreen:1
windowrulev2 = rounding 0, fullscreen:1

windowrulev2 = float, class:^(lazygit-float)$
windowrulev2 = float, class:^(ytfzf-music)$
windowrulev2 = size 85% 85%, class:^(ytfzf-music)$
windowrulev2 = center, class:^(ytfzf-music)$
windowrulev2 = size 85% 85%, class:^(lazygit-float)$
windowrulev2 = center, class:^(lazygit-float)$

# Dell Latitude 7210 Hyprlock Configuration (Catppuccin Mocha Tablet Theme)

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
}

# BACKGROUND
background {
    monitor =
    path = /home/johnny/.local/share/wallpapers/catppuccin.png
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8000
    vibrancy = 0.1800
    vibrancy_darkness = 0.05
}

# TOP-RIGHT LIVE STATUS (WiFi + Battery)
label {
    monitor =
    text = cmd[update:5000] echo "$($HOME/.local/bin/hyprlock-status)"
    color = rgba(205, 214, 244, 0.95)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -36, -28
    halign = right
    valign = top
}

# CENTER FROSTED GLASS CARD BACKDROP
shape {
    monitor =
    size = 460, 480
    color = rgba(30, 30, 46, 0.72)
    rounding = 24
    border_size = 2
    border_color = rgba(203, 166, 247, 0.45)
    position = 0, 0
    halign = center
    valign = center
}

# TIME (Inside Card)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 54
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# DATE (Inside Card)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(180, 190, 254, 0.95)
    font_size = 15
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 105
    halign = center
    valign = center
}

# USER BADGE (Inside Card)
label {
    monitor =
    text =   Welcome back, $USER
    color = rgba(203, 166, 247, 0.95)
    font_size = 14
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, 45
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD (Inside Card)
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 0.9)
    inner_color = rgba(49, 50, 68, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8"><i>󰌾  Enter Password...</i></span>
    hide_input = false
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>Authentication Failed <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(250, 179, 135, 1.0)
    rounding = 16
    position = 0, -35
    halign = center
    valign = center
}

# TOUCH KEYBOARD BUTTON BACKDROP (Clickable)
shape {
    monitor =
    size = 220, 40
    color = rgba(49, 50, 68, 0.85)
    rounding = 12
    border_size = 1
    border_color = rgba(203, 166, 247, 0.5)
    position = 0, -115
    halign = center
    valign = center
    onclick = /home/johnny/.local/bin/toggle-keyboard
}

# TOUCH KEYBOARD BUTTON LABEL (Clickable)
label {
    monitor =
    text = 󰌌  Touch Keyboard
    color = rgba(203, 166, 247, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -115
    halign = center
    valign = center
    onclick = /home/johnny/.local/bin/toggle-keyboard
}

# TABLET GESTURE HINT (Inside Card Bottom)
label {
    monitor =
    text = 󰁅 Swipe up from bottom bezel for keyboard
    color = rgba(108, 112, 134, 0.85)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
}

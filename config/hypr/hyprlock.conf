# Omarchy Hyprlock Configuration

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = /home/johnny/.local/share/wallpapers/catppuccin.png
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(242, 243, 244, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(192, 202, 245, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 60
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(122, 162, 247, 0.9)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.8)
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgba(192, 202, 245, 0.9)
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Password...</span>
    hide_input = false
    check_color = rgba(158, 206, 106, 0.8)
    fail_color = rgba(247, 118, 142, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -90
    halign = center
    valign = center
}

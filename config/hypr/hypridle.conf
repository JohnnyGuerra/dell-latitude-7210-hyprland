# Omarchy Hypridle Configuration

general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/systemd lock command
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
}

# Dim screen brightness after 90 seconds
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Turn off display after 3 minutes
listener {
    timeout = 180
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend system after 10 minutes (transitions to hibernation after 2h)
listener {
    timeout = 600
    on-timeout = systemctl suspend-then-hibernate
}

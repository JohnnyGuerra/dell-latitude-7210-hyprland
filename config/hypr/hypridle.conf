# Dell Latitude 7210 Hypridle Configuration (Hyprland 0.56+)

general {
    lock_cmd = ~/.local/bin/lock-screen                                     # tablet-aware lock command
    before_sleep_cmd = loginctl lock-session                                # lock before suspend
    after_sleep_cmd = ~/.local/bin/wake-display                              # resilient display wake & modeset restoration
}

# Dim screen brightness after 90 seconds (minimum 25% to prevent pitch black)
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 25%
    on-resume = brightnessctl -r; [ $(cat /sys/class/backlight/intel_backlight/actual_brightness 2>/dev/null || echo 0) -lt 36000 ] && brightnessctl set 45%
}

# Lock session & power off display after 3 minutes (180 seconds)
listener {
    timeout = 180
    on-timeout = loginctl lock-session && hyprctl -i 0 eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = ~/.local/bin/wake-display
}

# Suspend system after 10 minutes (transitions to hibernation after 2h)
listener {
    timeout = 600
    on-timeout = systemctl suspend-then-hibernate
}

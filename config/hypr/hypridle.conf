# Dell Latitude 7210 Hypridle Configuration (Hyprland 0.56+)

general {
    lock_cmd = pidof hyprlock || ~/.local/bin/lock-screen                   # tablet-aware lock command
    before_sleep_cmd = loginctl lock-session                                # lock before suspend
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ state = "on" })); hl.monitor({ output = "eDP-1", mode = "1920x1280@60.01Hz", position = "0x0", scale = "1.33" })' # wake display & restore modeset after resume
}

# Dim screen brightness after 90 seconds
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock session & power off display after 3 minutes (180 seconds)
listener {
    timeout = 180
    on-timeout = loginctl lock-session && hyprctl eval 'hl.dispatch(hl.dsp.dpms({ state = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ state = "on" })); hl.monitor({ output = "eDP-1", mode = "1920x1280@60.01Hz", position = "0x0", scale = "1.33" })'
}

# Suspend system after 10 minutes (transitions to hibernation after 2h)
listener {
    timeout = 600
    on-timeout = systemctl suspend-then-hibernate
}

# Dell Latitude 7210 2-in-1 Battery Optimization Profile
CPU_SCALING_GOVERNOR_ON_AC="powersave"
CPU_SCALING_GOVERNOR_ON_BAT="powersave"

CPU_ENERGY_PERF_POLICY_ON_AC="balance_performance"
CPU_ENERGY_PERF_POLICY_ON_BAT="balance_power"

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

PCIE_ASPM_ON_AC="default"
PCIE_ASPM_ON_BAT="powersave"

WIFI_PWR_ON_AC="off"
WIFI_PWR_ON_BAT="on"

SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

RUNTIME_PM_ON_AC="on"
RUNTIME_PM_ON_BAT="auto"

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1


# Battery Care: Charge Thresholds (Dell Latitude)
# Stops charging at 85% to preserve battery lifespan, starts charging below 75%
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# Intel UHD Graphics Frequency Capping on Battery (Comet Lake)
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=1150
INTEL_GPU_MAX_FREQ_ON_BAT=700
INTEL_GPU_BOOST_FREQ_ON_AC=1150
INTEL_GPU_BOOST_FREQ_ON_BAT=800
